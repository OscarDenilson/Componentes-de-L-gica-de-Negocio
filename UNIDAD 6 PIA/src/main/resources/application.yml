server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medinova}
    username: ${DB_USER:medinova}
    password: ${DB_PASSWORD:change_me_local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management: {}
